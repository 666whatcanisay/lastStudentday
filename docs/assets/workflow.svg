<rect width="1080" height="480" fill="#f6f8f7"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#173c44">
<text x="40" y="48" font-size="28" font-weight="600">从文件，到能核对、能交付、能查证的资料</text>
<text x="40" y="80" font-size="17" fill="#51696f">OCR 读字 · 规则找字段 · 人确认事实 · 当前有效版本贯穿后续功能</text>
<g fill="white" stroke="#b9ceca" stroke-width="1.5">
