</g>
<g text-anchor="middle" font-size="21" font-weight="600"><text x="125" y="155">上传原件</text><text x="330" y="155">本地 OCR</text><text x="535" y="155">分类与字段</text><text x="740" y="155">原件对照校对</text><text x="950" y="155">有效版本</text><text x="220" y="354">统计与明细</text><text x="540" y="354">PDF / Excel 导出</text><text x="860" y="354">查证与问答</text></g>
<g text-anchor="middle" font-size="16" fill="#51696f"><text x="125" y="186">格式 / 大小 / 内容去重</text><text x="330" y="186">图像准备 → 文字</text><text x="535" y="186">明确值才填写</text><text x="740" y="186">确认、修正、不猜填</text><text x="950" y="186">SQLite + 历史快照</text><text x="220" y="385">质量提示 / 同币种口径</text><text x="540" y="385">请求时锁定内容快照</text><text x="860" y="385">本地检索 → 可选云端生成</text></g>
