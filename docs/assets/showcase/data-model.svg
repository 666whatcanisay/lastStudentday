<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 635" width="1200" height="635" role="img" aria-label="六张业务表：文档主表、当前字段、版本快照、分块、索引状态与问答记录"><title>六张业务表：文档主表、当前字段、版本快照、分块、索引状态与问答记录</title><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#7d9ba2"/></marker></defs><g font-family="Segoe UI,Microsoft YaHei,PingFang SC,Noto Sans CJK SC,sans-serif"><rect x="0" y="0" width="1200" height="635" rx="20" fill="#f5f8fa" stroke="none"/><text x="40" y="49" font-size="29" fill="#173b43" font-weight="700">数据关系 · 六张业务表</text><text x="40" y="80" font-size="17" fill="#647e85" font-weight="400">主表保存当前指针，快照保留历史，检索状态跟随版本</text><rect x="390" y="115" width="420" height="92" rx="14" fill="#ffffff" stroke="#d5e2e6"/><text x="412" y="149" font-size="21" fill="#173b43" font-weight="600">document_info</text><text x="412" y="176" font-size="15" fill="#647e85" font-weight="400">id / current_revision / reviewed_revision</text><path d="M600 207 L600 252" stroke="#7d9ba2" stroke-width="2" fill="none" marker-end="url(#arr)"/><path d="M170 252 H1050" stroke="#7d9ba2" stroke-width="2"/><path d="M170.0 252 L170.0 292" stroke="#7d9ba2" stroke-width="2" fill="none" marker-end="url(#arr)"/><rect x="40" y="292" width="260" height="120" rx="14" fill="#eaf4f4" stroke="#d5e2e6"/><text x="56" y="326" font-size="20" fill="#173b43" font-weight="600">document_extract</text><text x="56" y="357" font-size="16" fill="#647e85" font-weight="400">1 对多 · 当前字段镜像</text><text x="56" y="388" font-size="13" fill="#647e85" font-weight="400">doc_id / field_key / value</text><path d="M470.0 252 L470.0 292" stroke="#7d9ba2" stroke-width="2" fill="none" marker-end="url(#arr)"/><rect x="340" y="292" width="260" height="120" rx="14" fill="#eaf4f4" stroke="#d5e2e6"/><text x="356" y="326" font-size="20" fill="#173b43" font-weight="600">document_revision</text><text x="356" y="357" font-size="16" fill="#647e85" font-weight="400">1 对多 · 历史内容快照</text><text x="356" y="388" font-size="13" fill="#647e85" font-weight="400">doc_id + revision 唯一</text><path d="M770.0 252 L770.0 292" stroke="#7d9ba2" stroke-width="2" fill="none" marker-end="url(#arr)"/><rect x="640" y="292" width="260" height="120" rx="14" fill="#eaf4f4" stroke="#d5e2e6"/><text x="656" y="326" font-size="20" fill="#173b43" font-weight="600">document_chunk</text><text x="656" y="357" font-size="16" fill="#647e85" font-weight="400">1 对多 · 正文和字段分块</text><text x="656" y="388" font-size="13" fill="#647e85" font-weight="400">revision / text / embedding</text><path d="M1050.0 252 L1050.0 292" stroke="#7d9ba2" stroke-width="2" fill="none" marker-end="url(#arr)"/><rect x="940" y="292" width="220" height="120" rx="14" fill="#eaf4f4" stroke="#d5e2e6"/><text x="956" y="326" font-size="20" fill="#173b43" font-weight="600">doc_index_state</text><text x="956" y="357" font-size="16" fill="#647e85" font-weight="400">1 对零或一 · 索引状态</text><text x="956" y="388" font-size="13" fill="#647e85" font-weight="400">doc_id 主键 + 外键</text><rect x="390" y="468" width="520" height="88" rx="14" fill="#ffffff" stroke="#d5e2e6"/><text x="412" y="502" font-size="21" fill="#173b43" font-weight="600">qa_record · 问答记录</text><text x="412" y="529" font-size="15" fill="#647e85" font-weight="400">question / answer / hit_chunk_ids 文本</text><text x="40" y="605" font-size="17" fill="#647e85" font-weight="400">关系线连接文档主表与其关联表；当前版本号由应用校验。qa_record 不设文档或分块外键。</text></g></svg>