<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="当前有效版本的本地双路检索、融合过滤、可选生成与引用查看"><title>当前有效版本的本地双路检索、融合过滤、可选生成与引用查看</title><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#7d9ba2"/></marker></defs><g font-family="Segoe UI,Microsoft YaHei,PingFang SC,Noto Sans CJK SC,sans-serif"><rect x="0" y="0" width="1200" height="630" rx="20" fill="#f5f8fa" stroke="none"/><text x="40" y="49" font-size="29" fill="#173b43" font-weight="700">本地检索与引用工作流</text><text x="40" y="80" font-size="17" fill="#647e85" font-weight="400">先检索相关片段，再检查引用；云端生成是可选分支</text><rect x="40" y="110" width="1120" height="93" rx="14" fill="#ffffff" stroke="#d5e2e6"/><text x="62" y="144" font-size="21" fill="#173b43" font-weight="600">索引期 · 读取当前有效版本</text><text x="62" y="171" font-size="15" fill="#647e85" font-weight="400">正文语义分块 + 有值字段摘要 → BGE 512 维向量 / BM25；提交前复核版本，原子替换</text><path d="M455 203 L455 290" stroke="#7d9ba2" stroke-width="2" fill="none" marker-end="url(#arr)"/><rect x="40" y="290" width="250" height="93" rx="14" fill="#eaf4f4" stroke="#d5e2e6"/><text x="62" y="324" font-size="21" fill="#173b43" font-weight="600">问题与上下文</text><text x="62" y="351" font-size="15" fill="#647e85" font-weight="400">用户提问 / 限定文档范围</text><rect x="330" y="290" width="250" height="93" rx="14" fill="#eaf4f4" stroke="#d5e2e6"/><text x="352" y="324" font-size="21" fill="#173b43" font-weight="600">规则改写与召回</text><text x="352" y="351" font-size="15" fill="#647e85" font-weight="400">关键词路 + 本地语义路</text><rect x="620" y="290" width="250" height="93" rx="14" fill="#eaf4f4" stroke="#d5e2e6"/><text x="642" y="324" font-size="21" fill="#173b43" font-weight="600">融合与过滤</text><text x="642" y="351" font-size="15" fill="#647e85" font-weight="400">RRF / 去重 / 当前版本</text><rect x="910" y="290" width="250" height="93" rx="14" fill="#eaf4f4" stroke="#d5e2e6"/><text x="932" y="324" font-size="21" fill="#173b43" font-weight="600">证据与来源</text><text x="932" y="351" font-size="15" fill="#647e85" font-weight="400">正文高亮 / 字段摘要</text><path d="M290 337 L330 337" stroke="#7d9ba2" stroke-width="2" fill="none" marker-end="url(#arr)"/><path d="M580 337 L620 337" stroke="#7d9ba2" stroke-width="2" fill="none" marker-end="url(#arr)"/><path d="M870 337 L910 337" stroke="#7d9ba2" stroke-width="2" fill="none" marker-end="url(#arr)"/><path d="M745 383 L745 448" stroke="#7d9ba2" stroke-width="2" fill="none" marker-end="url(#arr)"/><rect x="620" y="448" width="540" height="100" rx="14" fill="#ffffff" stroke="#d5e2e6"/><text x="640" y="482" font-size="22" fill="#173b43" font-weight="600">可选云端生成</text><text x="640" y="517" font-size="17" fill="#647e85" font-weight="400">仅发送相关上下文；未配置或失败时保留本地证据</text><path d="M1135 448 V410 H1035 V383" stroke="#7d9ba2" stroke-width="2" fill="none" marker-end="url(#arr)"/><rect x="40" y="448" width="540" height="100" rx="14" fill="#e5f1ef" stroke="none"/><text x="60" y="483" font-size="22" fill="#173b43" font-weight="600">查看同版本的有效全文</text><text x="60" y="518" font-size="17" fill="#647e85" font-weight="400">字段摘要明确标注；不把旧索引冒充当前事实</text><text x="40" y="600" font-size="17" fill="#647e85" font-weight="400">降级路径：无向量模型 → BM25；无云端回答 → 本地证据。引用存在不等于答案必然正确。</text></g></svg>