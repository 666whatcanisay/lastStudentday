<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 505" width="1200" height="505" role="img" aria-label="上传、OCR、抽取、版本发布、校对与下游使用的工作流"><title>上传、OCR、抽取、版本发布、校对与下游使用的工作流</title><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#7d9ba2"/></marker></defs><g font-family="Segoe UI,Microsoft YaHei,PingFang SC,Noto Sans CJK SC,sans-serif"><rect x="0" y="0" width="1200" height="505" rx="20" fill="#f5f8fa" stroke="none"/><text x="40" y="49" font-size="29" fill="#173b43" font-weight="700">从文件到有效资料</text><text x="40" y="80" font-size="17" fill="#647e85" font-weight="400">识别结果需要发布与确认，才能成为后续功能的数据基准</text><rect x="40" y="115" width="340" height="110" rx="14" fill="#ffffff" stroke="#d5e2e6"/><text x="60" y="151" font-size="18" fill="#2a7c85" font-weight="700">01</text><text x="102" y="151" font-size="22" fill="#173b43" font-weight="600">上传建档</text><text x="60" y="192" font-size="16" fill="#647e85" font-weight="400">格式 / 大小 / SHA-256 去重</text><rect x="430" y="115" width="340" height="110" rx="14" fill="#ffffff" stroke="#d5e2e6"/><text x="450" y="151" font-size="18" fill="#2a7c85" font-weight="700">02</text><text x="492" y="151" font-size="22" fill="#173b43" font-weight="600">逐页 OCR</text><text x="450" y="192" font-size="16" fill="#647e85" font-weight="400">PDF 渲染 / 预处理 / 文字框</text><rect x="820" y="115" width="340" height="110" rx="14" fill="#ffffff" stroke="#d5e2e6"/><text x="840" y="151" font-size="18" fill="#2a7c85" font-weight="700">03</text><text x="882" y="151" font-size="22" fill="#173b43" font-weight="600">按类型抽取</text><text x="840" y="192" font-size="16" fill="#647e85" font-weight="400">发票 / 合同 / 日期金额规范化</text><rect x="820" y="280" width="340" height="110" rx="14" fill="#ffffff" stroke="#d5e2e6"/><text x="840" y="316" font-size="18" fill="#2a7c85" font-weight="700">04</text><text x="882" y="316" font-size="22" fill="#173b43" font-weight="600">事务发布 r1</text><text x="840" y="357" font-size="16" fill="#647e85" font-weight="400">快照 + 当前字段 + 版本指针</text><rect x="430" y="280" width="340" height="110" rx="14" fill="#ffffff" stroke="#d5e2e6"/><text x="450" y="316" font-size="18" fill="#2a7c85" font-weight="700">05</text><text x="492" y="316" font-size="22" fill="#173b43" font-weight="600">原件对照校对</text><text x="450" y="357" font-size="16" fill="#647e85" font-weight="400">修改生成 r2 / 旧版本提交冲突</text><rect x="40" y="280" width="340" height="110" rx="14" fill="#ffffff" stroke="#d5e2e6"/><text x="60" y="316" font-size="18" fill="#2a7c85" font-weight="700">06</text><text x="102" y="316" font-size="22" fill="#173b43" font-weight="600">使用有效结果</text><text x="60" y="357" font-size="16" fill="#647e85" font-weight="400">统计 / 报告 / 当前索引与引用</text><path d="M380 170 L430 170" stroke="#7d9ba2" stroke-width="2" fill="none" marker-end="url(#arr)"/><path d="M770 170 L820 170" stroke="#7d9ba2" stroke-width="2" fill="none" marker-end="url(#arr)"/><path d="M990 225 L990 280" stroke="#7d9ba2" stroke-width="2" fill="none" marker-end="url(#arr)"/><path d="M820 335 L770 335" stroke="#7d9ba2" stroke-width="2" fill="none" marker-end="url(#arr)"/><path d="M430 335 L380 335" stroke="#7d9ba2" stroke-width="2" fill="none" marker-end="url(#arr)"/><rect x="40" y="423" width="1120" height="55" rx="14" fill="#e5f1ef" stroke="none"/><text x="60" y="457" font-size="17" fill="#275e62" font-weight="400">失败保护：重识别失败保留旧有效版本；索引过期不冒充当前证据；空值与歧义需要人工核对。</text></g></svg>