# Alembic config - Plan B database migrations
# NOTE: keep this file pure ASCII. Alembic reads it with locale encoding
# (GBK on this Windows machine); Chinese comments cause UnicodeDecodeError.
#
# sqlalchemy.url is injected dynamically by alembic/env.py from
# app.config.DATABASE_URL, so DOC_OCR_DATA_DIR isolation works.

[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
